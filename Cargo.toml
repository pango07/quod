[workspace]
resolver = "3"
members = ["crates/*"]
# The io_uring probe is a prototype with its own dependency; it builds on its
# own (cargo build --manifest-path crates/sp-uring-probe/Cargo.toml).
exclude = ["crates/sp-uring-probe"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sp-cas = { path = "crates/sp-cas" }
sp-key = { path = "crates/sp-key" }
sp-manifest = { path = "crates/sp-manifest" }
sp-proto = { path = "crates/sp-proto" }
sp-fs = { path = "crates/sp-fs" }
sp-sandbox = { path = "crates/sp-sandbox" }
sp-ledger = { path = "crates/sp-ledger" }
sp-replay = { path = "crates/sp-replay" }

anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
fuser = { version = "0.18", default-features = false }
io-uring = "0.7"
libc = "0.2"
proptest = "1.12"
insta = "1.49"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
