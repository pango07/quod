[workspace]
resolver = "3"
members = ["crates/*"]
# The io_uring probe is a prototype with its own dependency; it builds on its
# own (cargo build --manifest-path crates/quod-uring-probe/Cargo.toml).
exclude = ["crates/quod-uring-probe"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
quod-cas = { path = "crates/quod-cas" }
quod-key = { path = "crates/quod-key" }
quod-manifest = { path = "crates/quod-manifest" }
quod-proto = { path = "crates/quod-proto" }
quod-fs = { path = "crates/quod-fs" }
quod-sandbox = { path = "crates/quod-sandbox" }
quod-ledger = { path = "crates/quod-ledger" }
quod-replay = { path = "crates/quod-replay" }
quod-trust = { path = "crates/quod-trust" }
quod-hooks = { path = "crates/quod-hooks" }

anyhow = "1"
blake3 = "1.8"
# env: policy flags (--mode, --proofs, --audit, --timeout) also read
# QUOD_* variables, so suites and the bench set them once.
clap = { version = "4.6", features = ["derive", "env"] }
fuser = { version = "0.18", default-features = false }
io-uring = "0.7"
libc = "0.2"
proptest = "1.12"
insta = "1.49"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
