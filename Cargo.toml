[workspace]
resolver = "3"
members = ["crates/*"]
# The io_uring probe is a prototype with its own dependency; it builds on its
# own (cargo build --manifest-path crates/quod-uring-probe/Cargo.toml).
exclude = ["crates/quod-uring-probe"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
quod-cas = { path = "crates/quod-cas" }
quod-key = { path = "crates/quod-key" }
quod-manifest = { path = "crates/quod-manifest" }
quod-proto = { path = "crates/quod-proto" }
quod-fs = { path = "crates/quod-fs" }
quod-sandbox = { path = "crates/quod-sandbox" }
quod-ledger = { path = "crates/quod-ledger" }
quod-replay = { path = "crates/quod-replay" }
quod-trust = { path = "crates/quod-trust" }
quod-hooks = { path = "crates/quod-hooks" }
quod-wire = { path = "crates/quod-wire" }
quod-server = { path = "crates/quod-server" }

# quod.v1 (quod-wire, quod-server). Pinned at majors whose APIs the code is
# written against; see DECISIONS.md (exp/cloud-ledger).
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
ed25519-dalek = "2.2"
getrandom = "0.2"
hex = "0.4"
jsonwebtoken = "9.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# quod-server's own accept loop: hyper's header-read timeout needs a timer,
# which axum::serve does not set (DECISIONS, exp/cloud-ledger-v2 review).
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "server-auto", "tokio", "service", "http1", "http2"] }
tower-service = "0.3"
# statvfs for the volume's free-space floor, without unsafe code.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

anyhow = "1"
blake3 = "1.8"
# env: policy flags (--mode, --proofs, --audit, --timeout) also read
# QUOD_* variables, so suites and the bench set them once.
clap = { version = "4.6", features = ["derive", "env"] }
fuser = { version = "0.18", default-features = false }
io-uring = "0.7"
libc = "0.2"
proptest = "1.12"
insta = "1.49"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
