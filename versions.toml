# Every pinned version for the spike lives here. Nothing else states a version
# (rust-toolchain.toml mirrors [rust] because rustup only reads that file).

[rust]
toolchain = "1.98.0"

[go]
# Matches the spike repo's go.mod `toolchain` line.
version = "1.27.3"

[node]
# LTS (Krypton), installed at /usr/local/node in the dev image.
version = "24.22.2"

[python]
# A python-build-standalone release, installed at /usr/local/python.
version = "3.12.16"
pbs_release = "20261026"

[uv]
# Installs Python dependencies from uv.lock; at /usr/local/uv/bin.
version = "0.13.6"

[spike_repo]
url = "https://github.com/cli/cli"
# Pinned for acceptance and overhead runs (trunk on 2026-10-30).
commit = "9490d204a2ba95434153dedce99898ce9f281426"

[rootfs]
# The step rootfs (Dockerfile.rootfs, scripts/build-rootfs.sh): what the step
# key's `image` field pins in rootfs mode. The base is debian:bookworm-slim by
# OCI manifest digest per architecture; its packages (git, openssh-client,
# ca-certificates) come from the Debian snapshot archive at `apt_snapshot`;
# Go is the [go] version, its tarball checked against `go_sha256_*`.
base = "debian:bookworm-slim"
base_digest_arm64 = "sha256:7ccb8b5b60c7654f5b795d94ee7d751cd0811500803f0b09cefcd555e755a55a"
base_digest_amd64 = "sha256:a3bba7dc7dbcc1f37c2856c51fc9a7fac96608f50cb87b1b4e4d8b8c85ae988e"
apt_snapshot = "20261030T000000Z"
go_sha256_arm64 = "a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49"
go_sha256_amd64 = "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
# Quod digest of the imported rootfs (`quod rootfs import`): BLAKE3
# of the canonical tree document, what the step key pins. Printed by
# build-rootfs.sh; pass it as --rootfs (or QUOD_ROOTFS). The image id
# beside it is the exported image's OCI config digest (`--rootfs sha256:...`
# resolves to the same rootfs).
digest_arm64 = "b3:3500d16706fdcce98ff64e08ef1b40b4690db7a46f9b317643d7ede39eb0b61d"
image_id_arm64 = "sha256:89658b74a5326b6e912ad7da13ae37a280d79d12d6da2555a33d3bf3b4a0085e"
digest_amd64 = ""
image_id_amd64 = ""
# The polyglot corpus (exp/polyglot): one real repo per toolchain besides
# Go, each with real Actions CI, a lockfile and a test suite that passes
# offline after the setup step. `setup` is step A (network, never
# memoized), `step` is step B (observed, memoized), `touch` the file the
# one-file bench appends a comment to.
[corpus.node]
# moment/luxon: Jest, package-lock.json, 1,222 tests in 58 suites. Its
# workflow (.github/workflows/test.yml) runs `npm test` with these three
# variables set at the job level; the step script sets them the same way.
# `--maxWorkers=4` caps Jest on the shared dev box (part of the step, so
# part of the key; fixed for every run of this experiment).
url = "https://github.com/moment/luxon"
commit = "f427515a38f6a671f8de663e6bcc040ed81f114e"
setup = "npm ci"
step = "export LANG=en_US.utf8 LIMIT_JEST=yes TZ=America/New_York; npm test -- --maxWorkers=4"
touch = "src/datetime.js"

[corpus.python]
# encode/starlette: pytest, uv.lock, 1,414 tests (asyncio and trio). Its
# workflow runs scripts/install (`uv sync --frozen`) then scripts/test
# (`uv run coverage run -m pytest`); the step runs pytest without coverage.
url = "https://github.com/encode/starlette"
commit = "2745bbc5afa2f8ce900d290bedca2bc5d3f3cfe8"
setup = "uv sync --frozen"
step = "python -m pytest"
touch = "starlette/routing.py"

[actions_runner]
# The official runner the quod runner drives (scripts/runner/install.sh).
# The release tarballs' SHA-256, as the release notes publish them; the pool
# and install.sh refuse a download that does not match.
version = "2.338.2"
sha256_x64 = "baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40"
sha256_arm64 = "670adb2f268fe21dcbb58b3db0e0aa9d5b3bddfe2c651481336e561ff86de945"

[job_image]
# The job container of the gate workflow: golang:1.27.3 (OCI index digest,
# resolved to the linux/arm64 manifest at unpack).
golang = "golang@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b"

[firecracker]
# 0b. Deferred (DECISIONS 2026-10-31: pinned OCI rootfs under bubblewrap first).
version = ""

[virtiofsd]
version = ""

[guest]
# BLAKE3 of the rootfs image produced by scripts/build-guest.sh (T13).
rootfs_b3 = ""
kernel = ""
