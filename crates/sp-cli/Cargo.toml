[package]
name = "sp-cli"
version = "0.0.0"
description = "The stillpass command line."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sp-cas.workspace = true
sp-key.workspace = true
sp-manifest.workspace = true
sp-fs.workspace = true
sp-sandbox.workspace = true
sp-ledger.workspace = true
sp-replay.workspace = true
sp-trust.workspace = true
anyhow.workspace = true
clap.workspace = true
# The rootfs document and import record are serde types (rootfs.rs).
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[features]
# Builds the binary with the ring transport's test-only failure hooks
# (STILLPASS_TEST_URING_FAULT); only tests/ring_faults.rs needs it.
fault-injection = ["sp-fs/fault-injection"]

[dev-dependencies]
# O_PATH, for ring_faults.rs holding a mount busy.
libc.workspace = true
tempfile.workspace = true

[[test]]
name = "ring_faults"
required-features = ["fault-injection"]

[[test]]
name = "observer_faults"
required-features = ["fault-injection"]

[[bin]]
name = "stillpass"
path = "src/main.rs"
