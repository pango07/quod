[package]
name = "sp-fs"
version = "0.0.0"
description = "The observer: a read-only FUSE view of a CAS tree that logs every access."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sp-cas.workspace = true
sp-manifest.workspace = true
libc.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true
io-uring.workspace = true

[features]
# Test-only failure hooks for the ring transport (`Options::fault`,
# STILLPASS_TEST_URING_FAULT). Off in every build that records results.
fault-injection = []

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "uring"
required-features = ["fault-injection"]

[[test]]
name = "faults"
required-features = ["fault-injection"]
