[package]
name = "quod-cli"
version = "0.0.0"
description = "The quod command line."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
quod-cas.workspace = true
quod-key.workspace = true
quod-manifest.workspace = true
quod-fs.workspace = true
quod-sandbox.workspace = true
quod-ledger.workspace = true
quod-replay.workspace = true
quod-trust.workspace = true
quod-wire = { workspace = true, features = ["client"] }
quod-hooks.workspace = true
anyhow.workspace = true
# Hashing the inputs `quod vitest` keys test files on (vitest.rs).
blake3.workspace = true
clap.workspace = true
# umount2, for the sweep of what a killed run left mounted (state.rs).
libc.workspace = true
# Safe permission/ACL queries for replay input keys (vitest.rs).
rustix.workspace = true
# The rootfs document and import record are serde types (rootfs.rs).
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[features]
# Builds the binary with the observer's test-only failure hooks
# (QUOD_TEST_URING_FAULT, QUOD_FAULT); only tests/ring_faults.rs
# and tests/observer_faults.rs need it.
fault-injection = ["quod-fs/fault-injection"]

[dev-dependencies]
tempfile.workspace = true
# tests/server.rs: a quod-server in-process.
quod-server.workspace = true
blake3.workspace = true
hex.workspace = true
tokio.workspace = true

[[test]]
name = "ring_faults"
required-features = ["fault-injection"]

[[test]]
name = "observer_faults"
required-features = ["fault-injection"]

[[bin]]
name = "quod"
path = "src/main.rs"
