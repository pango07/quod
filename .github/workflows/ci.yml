name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    # FUSE, overlayfs and bubblewrap need root or user namespaces.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: host setup
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3 bubblewrap sqlite3
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: scripts/check-host.sh || true
      - run: cargo test --workspace --no-run
      - name: integration tests (root)
        run: sudo -E env "PATH=$PATH" STILLPASS_INTEGRATION=1 cargo test --workspace -- --test-threads=1
