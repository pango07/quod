# The original check: fmt, clippy, unit tests, then the integration tests as
# root. gate.yml's lint job runs all of it (scripts/lint.sh, as root, with
# QUOD_INTEGRATION=1) with cached dependencies, on every pull request to main,
# so this workflow no longer runs by itself: it compiled the workspace twice,
# uncached, on every pull request and every push to main. Dispatch only.
#   gh workflow run ci.yml --ref <branch>
name: ci
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    # FUSE, overlayfs and bubblewrap need root or user namespaces.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: host setup
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3 bubblewrap sqlite3
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: go at /usr/local/go (the sandbox only sees /usr)
        run: |
          v=$(sed -n '/^\[go\]/,/^\[/s/^version = "\(.*\)"/\1/p' versions.toml)
          sudo rm -rf /usr/local/go
          curl -fsSL "https://go.dev/dl/go${v}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      - run: scripts/check-host.sh || true
      - run: cargo test --workspace --no-run
      - name: integration tests (root)
        run: sudo -E env "PATH=$PATH" QUOD_INTEGRATION=1 cargo test --workspace -- --test-threads=1
