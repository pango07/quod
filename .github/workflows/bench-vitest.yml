# Test-file-level replay for vitest, measured on a real project's history.
#
# For each of N consecutive first-parent commits ending at a pinned commit
# (oldest first), on one runner, interleaved: plain `vitest` (warm
# dependency install, the strongest fair baseline) and `quod vitest`, which
# runs only the test files whose recorded inputs changed and replays the
# rest. Every commit's two JSON reports are compared file by file and test
# by test: any difference in a replayed file is a wrong replay.
#
#   gh workflow run bench-vitest.yml --ref exp/vitest-fast
#   gh workflow run bench-vitest.yml --ref exp/vitest-fast -f mode=profile
#
# The project lives in /work (a runner's home is 0750; the observer's
# sandbox cannot reach it) and runs on the pinned node at /usr/local/node,
# which both series use.
name: bench-vitest

on:
  # A push to the branch runs it when the commit message says [bench] or
  # [profile] (a dispatch needs the workflow on the default branch).
  push:
    branches: ['exp/vitest-fast']
  workflow_dispatch:
    inputs:
      mode:
        description: "bench (the N-commit benchmark) or profile (the recorder's cost, full runs at the pinned commit)"
        required: false
        default: bench
      repo:
        description: The project
        required: false
        default: vuejs/core
      sha:
        description: The last commit of the window
        required: false
        default: 68f25a4a1957710de71731702bd42e05535f494b
      commits:
        description: How many first-parent commits
        required: false
        default: '20'
      vitest_args:
        description: The project's unit test command's vitest arguments
        required: false
        default: run --project unit*

permissions:
  contents: read

env:
  MODE: ${{ inputs.mode || (contains(github.event.head_commit.message, '[profile]') && 'profile') || 'bench' }}
  REPO: ${{ inputs.repo || 'vuejs/core' }}
  SHA: ${{ inputs.sha || '68f25a4a1957710de71731702bd42e05535f494b' }}
  COMMITS: ${{ inputs.commits || '20' }}
  VITEST_ARGS: ${{ inputs.vitest_args || 'run --project unit*' }}
  PROJ: /work/proj

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[profile]') || contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/quod-host
        with:
          toolchains: node
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench-vitest
      - name: build quod
        run: cargo build --release --locked -p quod-cli && cp target/release/quod "$RUNNER_TEMP/quod"
      - name: checkout the project, pnpm, dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          echo /usr/local/node/bin >> "$GITHUB_PATH"
          export PATH=/usr/local/node/bin:$PATH
          git clone -q --filter=blob:none "https://github.com/$REPO" "$PROJ"
          cd "$PROJ"
          git checkout -q "$SHA"
          pm=$(node -p "(require('./package.json').packageManager||'pnpm@latest').split('+')[0]")
          sudo env PATH="$PATH" npm i -g -s "$pm"
          node --version; pnpm --version
          pnpm install --frozen-lockfile
      - name: profile
        if: env.MODE == 'profile'
        env:
          QUOD: ${{ runner.temp }}/quod
        run: bash scripts/bench-vitest/profile.sh "$PROJ" $VITEST_ARGS
      - name: bench
        if: env.MODE == 'bench'
        env:
          QUOD: ${{ runner.temp }}/quod
        run: bash scripts/bench-vitest/bench.sh "$PROJ" "$SHA" "$COMMITS" $VITEST_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-vitest
          path: |
            ${{ runner.temp }}/bench-vitest/report.md
            ${{ runner.temp }}/bench-vitest/*.jsonl
            ${{ runner.temp }}/bench-vitest/logs
          if-no-files-found: ignore
