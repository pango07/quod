# Test-file-level replay for vitest, measured on a real project's history.
#
# For each of N consecutive first-parent commits ending at a pinned commit
# (oldest first), on one runner, interleaved: plain `vitest run` (warm
# dependency install, the strongest fair baseline) and `quod vitest`, which
# runs only the test files whose recorded inputs changed and replays the
# rest. Every commit's two JSON reports are compared file by file and test
# by test: any difference in a replayed file is a wrong replay.
#
#   gh workflow run bench-vitest.yml --ref exp/vitest-fast
#   gh workflow run bench-vitest.yml --ref exp/vitest-fast -f mode=smoke
name: bench-vitest

on:
  # A push to the branch runs it when the commit message says [smoke] or
  # [bench] (a dispatch needs the workflow on the default branch).
  push:
    branches: ['exp/vitest-fast']
  workflow_dispatch:
    inputs:
      mode:
        description: "bench (the N-commit benchmark) or smoke (the driver alone, one commit)"
        required: false
        default: bench
      repo:
        description: The project
        required: false
        default: vuejs/core
      sha:
        description: The last commit of the window
        required: false
        default: 68f25a4a1957710de71731702bd42e05535f494b
      commits:
        description: How many first-parent commits
        required: false
        default: '20'
      vitest_args:
        description: The project's unit test command's vitest arguments
        required: false
        default: run --project unit*

permissions:
  contents: read

env:
  MODE: ${{ inputs.mode || (contains(github.event.head_commit.message, '[smoke]') && 'smoke') || 'bench' }}
  REPO: ${{ inputs.repo || 'vuejs/core' }}
  SHA: ${{ inputs.sha || '68f25a4a1957710de71731702bd42e05535f494b' }}
  COMMITS: ${{ inputs.commits || '20' }}
  VITEST_ARGS: ${{ inputs.vitest_args || 'run --project unit*' }}

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]') || contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: quod
      - name: checkout the project
        run: |
          git clone -q --filter=blob:none "https://github.com/$REPO" proj
          cd proj
          git checkout -q "$SHA"
      - name: rust toolchain
        if: env.MODE == 'bench'
        working-directory: quod
        run: |
          ch=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.MODE == 'bench'
        with:
          workspaces: quod
          shared-key: bench-vitest
      - name: build quod
        if: env.MODE == 'bench'
        working-directory: quod
        run: cargo build --release --locked -p quod-cli && cp target/release/quod "$RUNNER_TEMP/quod"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: proj/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: proj/.node-version
      - name: install the project's dependencies
        working-directory: proj
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile
      - name: smoke
        if: env.MODE == 'smoke'
        run: bash quod/scripts/bench-vitest/smoke.sh proj $VITEST_ARGS
      - name: bench
        if: env.MODE == 'bench'
        env:
          QUOD: ${{ runner.temp }}/quod
        run: bash quod/scripts/bench-vitest/bench.sh proj "$SHA" "$COMMITS" $VITEST_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-vitest
          path: |
            ${{ runner.temp }}/bench-vitest/report.md
            ${{ runner.temp }}/bench-vitest/*.jsonl
            ${{ runner.temp }}/bench-vitest/logs
          if-no-files-found: ignore
