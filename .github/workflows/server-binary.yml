# A quod-server binary (x86_64 Linux, release) from this branch's HEAD, for
# bench workflows that run their own server (pango07/ci-bench
# bench-dropin.yml). Throwaway branch: never merged.
name: server-binary
on:
  push:
    branches: ['ci/server-binary']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain (rust-toolchain.toml)
        run: |
          ch=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server-binary
      - name: build
        run: |
          cargo build --release --locked -p quod-server
          mkdir -p dist && cp target/release/quod-server dist/ && strip dist/quod-server
          tar -C dist -czf quod-server-linux-x86_64.tar.gz quod-server
          git rev-parse HEAD > sha.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-binary
          path: |
            quod-server-linux-x86_64.tar.gz
            sha.txt
          retention-days: 7
