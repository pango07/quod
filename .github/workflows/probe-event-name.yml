name: probe-event-name
on:
  push:
    branches: [runner-lab]
    paths: ['.github/workflows/probe-event-name.yml']
env:
  GITHUB_EVENT_NAME: schedule
jobs:
  host:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - name: workflow and job env set it
        run: echo "PROBE host workflow+job env -> GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME (github.event_name=${{ github.event_name }})"
      - name: step env sets it
        env:
          GITHUB_EVENT_NAME: schedule
        run: echo "PROBE host step env -> GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
      - name: GITHUB_ENV sets it
        run: echo "GITHUB_EVENT_NAME=schedule" >> "$GITHUB_ENV"
      - name: after GITHUB_ENV
        run: echo "PROBE host after GITHUB_ENV -> GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
  container:
    runs-on: ubuntu-latest
    container: alpine:3.20
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - name: container job, step env sets it
        env:
          GITHUB_EVENT_NAME: schedule
        run: echo "PROBE container step env -> GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
      - name: container job, job env
        run: echo "PROBE container job env -> GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
