# cli/cli's "Unit and Integration Tests" build job (.github/workflows/go.yml at
# the pinned commit), on the stillpass runner in the golang job container
# (as uid 1001: cli/cli's permission tests fail as root).
name: go-test
on:
  workflow_dispatch:
    inputs:
      commit:
        description: cli/cli commit to test
        default: 9490d204a2ba95434153dedce99898ce9f281426
      flags:
        description: go test flags
        default: "-count=1 -race -tags=integration"
jobs:
  build:
    runs-on: [self-hosted, stillpass]
    container:
      image: golang@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
      options: --user 1001:1001
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cli/cli
          ref: ${{ inputs.commit }}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key-prefix: go-race

      - name: Download dependencies
        run: go mod download

      - name: Run unit and integration tests
        run: go test ${{ inputs.flags }} ./...

      - name: Build
        run: go build -v ./cmd/gh

      - name: Build with debug overrides
        run: go build -v -tags=ghdebug ./cmd/gh
