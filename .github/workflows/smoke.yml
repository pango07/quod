name: smoke
on: workflow_dispatch
env:
  NODE_OPTIONS: --title=stillpass-probe-wf
jobs:
  smoke:
    runs-on: [self-hosted, stillpass]
    container:
      image: golang@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
    env:
      NODE_PATH: /tmp/np-probe-job
    steps:
      - name: echo
        env:
          NODE_OPTIONS: --title=stillpass-probe-step
          DEPLOY_PROBE_KEY: ${{ secrets.DEPLOY_PROBE_KEY }}
          PROBE_PLAIN: ${{ secrets.PROBE_PLAIN }}
        run: echo "probe step ran"