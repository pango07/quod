# The heavy gates on GitHub's runners instead of the dev VM: lint, the merge
# gate, the hooks acceptance suite and the CLI acceptance corpora (cli/cli,
# luxon, starlette), and bench-lite, the fast benchmark. Every gate is one
# `scripts/ci-gate.sh` command, the same one the dev box runs. docs/ci.md says
# what each job proves, how long it takes, what is cached and why, when each
# runs (the trigger policy) and the minute budget.
#
#   gh workflow run gate.yml --ref <branch>                 # every job
#   gh workflow run gate.yml --ref <branch> -f only=hooks,acceptance-cli
#   gh run watch
name: gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: ['exp/**', 'fix/**', 'cloud/**', 'ci/**']
  # Nightly, the corpus acceptance gates on main, when main moved that day.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to gate (default the ref the workflow runs on; it must contain scripts/ci-gate.sh)
        required: false
        default: ''
      only:
        description: "Comma-separated jobs, or all: lint, merge-gate, bench-lite, hooks, acceptance-cli, acceptance-node, acceptance-python, cloud, server-cloud; bench-real only when named"
        required: false
        default: all
      bench_real:
        description: "bench-real's arguments (scripts/bench-real.sh), e.g. --repos go --n 5"
        required: false
        default: ''

concurrency:
  # A dispatch is grouped by what it runs too, so dispatching bench-real (or
  # a corpus gate) neither cancels nor is cancelled by the push gates.
  group: gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.only || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  QUOD_GATE_LOGS: ${{ github.workspace }}/target/gate-logs

jobs:
  # Which jobs this event runs (docs/ci.md, "Triggers"). Rust gates run
  # when anything outside cloud/ changed, the cloud job when cloud/ changed.
  # A push, or a new commit on a pull request, runs lint, merge-gate and
  # bench-lite (and cloud); a pull request opened, reopened or marked ready
  # adds hooks (before merge); the nightly schedule runs the three corpus
  # acceptance gates on main when main moved in the last 24 h; a dispatch
  # runs what `only` names (default all), whatever changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.pick.outputs.lint }}
      merge-gate: ${{ steps.pick.outputs.merge-gate }}
      bench-lite: ${{ steps.pick.outputs.bench-lite }}
      bench-real: ${{ steps.pick.outputs.bench-real }}
      hooks: ${{ steps.pick.outputs.hooks }}
      acceptance-cli: ${{ steps.pick.outputs.acceptance-cli }}
      acceptance-node: ${{ steps.pick.outputs.acceptance-node }}
      acceptance-python: ${{ steps.pick.outputs.acceptance-python }}
      cloud: ${{ steps.pick.outputs.cloud }}
      server-cloud: ${{ steps.pick.outputs.server-cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          core=false cloud=false
          # The corpus gates cost ~2.5 h of runner time; see docs/ci.md.
          if [ "$EVENT" = push ] || [ "$ACTION" = synchronize ]; then
            ONLY=lint,merge-gate,bench-lite,cloud,server-cloud
            echo "fast gates only ($EVENT${ACTION:+ $ACTION}); hooks runs on a pull request opened or ready, the corpus gates nightly or by dispatch"
          elif [ "$EVENT" = pull_request ]; then
            ONLY=lint,merge-gate,bench-lite,hooks,cloud,server-cloud
            echo "pull request $ACTION: the fast gates and hooks; the corpus gates run nightly on main or by dispatch"
          elif [ "$EVENT" = schedule ]; then
            ONLY=acceptance-cli,acceptance-node,acceptance-python
          fi
          case "$EVENT" in
            workflow_dispatch) core=true cloud=true;;
            schedule)
              if [ -n "$(git log -1 --since='24 hours ago' --format=%H HEAD)" ]; then core=true
              else echo "main has not moved in 24 h: nothing to run"; fi;;
            pull_request) files=$(git diff --name-only "$BASE...$HEAD");;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE
              else base=$(git merge-base origin/main HEAD); fi
              files=$(git diff --name-only "$base" HEAD);;
          esac
          if [ "$EVENT" != workflow_dispatch ] && [ "$EVENT" != schedule ] && [ -n "${files:-}" ]; then
            printf 'changed:\n%s\n' "${files:-(none)}" | head -50
            if grep -qv '^cloud/' <<<"$files"; then core=true; fi
            if grep -q '^cloud/' <<<"$files"; then cloud=true; fi
          fi
          want() { [ "$ONLY" = all ] || [[ ",${ONLY// /}," == *",$1,"* ]]; }
          for j in lint merge-gate bench-lite hooks acceptance-cli acceptance-node acceptance-python server-cloud; do
            r=false; [ "$core" = true ] && want "$j" && r=true
            echo "$j=$r" | tee -a "$GITHUB_OUTPUT"
          done
          r=false; [ "$cloud" = true ] && want cloud && r=true
          echo "cloud=$r" | tee -a "$GITHUB_OUTPUT"
          # bench-real (~1-2 h here) runs only when a dispatch names it.
          r=false; [ "$EVENT" = workflow_dispatch ] && [[ ",${ONLY// /}," == *",bench-real,"* ]] && r=true
          echo "bench-real=$r" | tee -a "$GITHUB_OUTPUT"

  # fmt, clippy (default and all features), every workspace test with
  # QUOD_INTEGRATION=1 as root, with every corpus toolchain installed, as the
  # dev container runs scripts/lint.sh.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUOD_INTEGRATION: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
      - run: scripts/ci-gate.sh lint
      - if: always()
        run: scripts/ci-gate.sh summary lint >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-logs
          path: target/gate-logs/
          retention-days: 14

  # The ring suites (uring, ring_faults, faults and observer_faults with
  # their ring cases, transports_log_identically). lint runs as its own job,
  # so the merge gate here skips it; without the ring it skips the ring
  # suites with a message and runs the classic cases.
  merge-gate:
    needs: changes
    if: needs.changes.outputs.merge-gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUOD_INTEGRATION: 1
      QUOD_GATE_SKIP_LINT: 1
      QUOD_RING_OPTIONAL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: merge-gate
          cache-on-failure: true
      - run: scripts/ci-gate.sh merge-gate
      - if: always()
        run: scripts/ci-gate.sh summary merge-gate >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-gate-logs
          path: target/gate-logs/
          retention-days: 14

  # The fast benchmark (scripts/bench-lite.sh, docs/bench/lite-baseline.md):
  # a generated Go + Node + Python monorepo's 18 jobs, plain and through
  # quod run / quod step, interleaved; every replay compared with the plain
  # run of the same tree. Fails on any wrong replay. The table goes to the
  # job summary with the deltas against docs/bench/lite-baseline.json; the
  # rows and the summary JSON are uploaded.
  bench-lite:
    needs: changes
    if: needs.changes.outputs.bench-lite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
      - run: scripts/ci-gate.sh bench-lite --against main
      - if: always()
        run: |
          if [ -f .bench-lite/table.md ]; then
            { echo '### bench-lite'; echo; cat .bench-lite/table.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            scripts/ci-gate.sh summary bench-lite >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-lite
          path: |
            .bench-lite/
            target/gate-logs/
          include-hidden-files: true
          retention-days: 30

  # bench-real-small (scripts/bench-real.sh, docs/bench/real-small.md): Quod
  # against plain on three small real repos' last 20 first-parent commits,
  # history and PR traffic, every replay spot-checked. Dispatch only:
  #   gh workflow run gate.yml --ref <branch> -f only=bench-real
  # ubuntu-latest has 2 vCPUs for a private repository (4 for a public one).
  bench-real:
    needs: changes
    if: needs.changes.outputs.bench-real == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
      - env:
          ARGS: ${{ inputs.bench_real }}
        run: scripts/ci-gate.sh bench-real $ARGS
      - if: always()
        run: |
          if [ -f .bench-real/report.md ]; then cat .bench-real/report.md >> "$GITHUB_STEP_SUMMARY"
          else scripts/ci-gate.sh summary bench-real >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-real
          path: |
            .bench-real/
            target/gate-logs/
          include-hidden-files: true
          retention-days: 90

  # A1-A7 (+A7b), trust, secrets and the served git index through the
  # hooks path (tests/hooks_acceptance.rs) on cli/cli at its pinned commit,
  # jobs seeded from the checkout's .quod/gomod.
  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: hooks
      corpus: hooks
      toolchains: go
      timeout: 120
      ref: ${{ inputs.ref || '' }}

  # scripts/acceptance.sh per corpus: step A, A1-A7 (+A7b, W1-W4 where the
  # profile has warm state), the trust suite (T1-T11) and T7.
  acceptance-cli:
    needs: changes
    if: needs.changes.outputs.acceptance-cli == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: go
      toolchains: go
      timeout: 150
      ref: ${{ inputs.ref || '' }}

  acceptance-node:
    needs: changes
    if: needs.changes.outputs.acceptance-node == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: node
      toolchains: go node
      timeout: 75
      ref: ${{ inputs.ref || '' }}

  acceptance-python:
    needs: changes
    if: needs.changes.outputs.acceptance-python == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: python
      toolchains: go python
      timeout: 75
      ref: ${{ inputs.ref || '' }}

  # quod-server on Quod Cloud's backends (docs/cloud-ledger.md, P4): a real
  # Postgres and a MinIO, both service containers. The
  # server's suites run twice, on SQLite and on Postgres + S3 (S1-S15, the
  # S2 races among them, and tests/cloud.rs P1-P5), with quod-ledger's and
  # quod-cas's unit tests and clippy on the three crates. The job also
  # leaves Cargo.lock and any rustfmt diff as an artifact.
  server-cloud:
    needs: changes
    if: needs.changes.outputs.server-cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quod
          POSTGRES_PASSWORD: quod-test
          POSTGRES_DB: quod
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quod" --health-interval 2s --health-timeout 5s --health-retries 30
      # MinIO's own images are no longer on Docker Hub; Bitnami's archived
      # build starts the server by itself, so it can be a service.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: quodtest
          MINIO_ROOT_PASSWORD: quodtest-secret
          MINIO_DEFAULT_BUCKETS: quod-test
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      QUOD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      QUOD_TEST_S3_BUCKET: quod-test
      QUOD_TEST_S3_ACCESS_KEY_ID: quodtest
      QUOD_TEST_S3_SECRET_ACCESS_KEY: quodtest-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: rust toolchain (rust-toolchain.toml)
        run: |
          ch=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal -c rustfmt -c clippy --no-self-update
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server-cloud
          cache-on-failure: true
      - name: MinIO answers
        run: curl -fsS http://127.0.0.1:9000/minio/health/live
      - name: rustfmt (the diff is kept as an artifact)
        if: success() || failure()
        run: |
          mkdir -p target/gate-logs
          cargo fmt --all
          git diff -- '*.rs' > target/gate-logs/fmt.patch
          if [ -s target/gate-logs/fmt.patch ]; then echo "::warning::rustfmt changes: see fmt.patch"; fi
      - name: clippy (quod-server, quod-ledger, quod-cas)
        if: success() || failure()
        run: cargo clippy -q -p quod-server -p quod-ledger -p quod-cas --all-targets -- -D warnings
      - name: quod-ledger and quod-cas unit tests
        if: success() || failure()
        run: cargo test -q -p quod-ledger -p quod-cas
      - name: quod-server on SQLite
        if: success() || failure()
        run: cargo test -p quod-server 2>&1 | tee target/gate-logs/server-sqlite.log; exit "${PIPESTATUS[0]}"
      - name: quod-server on Postgres + S3
        if: success() || failure()
        env:
          QUOD_TEST_DATABASE_URL: postgresql://quod:quod-test@127.0.0.1:5432/quod
        run: cargo test -p quod-server -- --test-threads 4 2>&1 | tee target/gate-logs/server-cloud.log; exit "${PIPESTATUS[0]}"
      - name: the races on Postgres, named
        if: success() || failure()
        env:
          QUOD_TEST_DATABASE_URL: postgresql://quod:quod-test@127.0.0.1:5432/quod
        run: |
          for i in 1 2 3; do
            cargo test -q -p quod-server --test server -- --exact s2_racing_commits_prove_once_and_racing_claims_replay_once
            cargo test -q -p quod-server --test cloud -- --exact p2_atomically_is_all_or_nothing_and_never_interleaves
          done
      - name: rustfmt is clean
        if: success() || failure()
        run: test ! -s target/gate-logs/fmt.patch
      - if: always()
        run: mkdir -p target/gate-logs && cp Cargo.lock target/gate-logs/Cargo.lock
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-cloud-logs
          path: target/gate-logs/
          retention-days: 14

  # cloud/ (the Next.js dashboard): its own checks, only when it changed.
  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - id: node
        working-directory: .
        run: echo "version=$(sed -n '/^\[node\]/,/^\[/s/^version = "\(.*\)"/\1/p' versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The route types (PageProps, LayoutProps) are generated into .next/,
      # which `next dev` and `next build` write and a fresh checkout lacks.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  benchmark-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
      - run: sudo apt-get update -qq && sudo apt-get install -y fuse3 libfuse3-dev pkg-config bubblewrap strace
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: lint
          cache-on-failure: true
      - name: format and preserve any correction
        run: |
          cargo fmt --all
          git diff -- '*.rs' > /tmp/benchmark-fmt.patch
      - name: CLI unit tests and recorder regressions
        run: cargo test --locked -p quod-cli --bin quod --test vitest_recorder --test unit_e2e
      - name: clippy
        run: cargo clippy --locked -p quod-cli --bin quod --test vitest_recorder --test unit_e2e -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: benchmark-audit-format
          path: /tmp/benchmark-fmt.patch

  benchmark-binary:
    needs: benchmark-audit
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
      - run: sudo apt-get update -qq && sudo apt-get install -y libfuse3-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: release
          cache-on-failure: true
      - run: |
          cargo build --release --locked -p quod-cli
          mkdir -p /tmp/benchmark-binary
          cp target/release/quod /tmp/benchmark-binary/quod
          strip /tmp/benchmark-binary/quod
          tar -C /tmp/benchmark-binary -czf /tmp/quod-linux-x86_64.tar.gz quod
          sha256sum /tmp/quod-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-binary
          path: /tmp/quod-linux-x86_64.tar.gz

  benchmark-action:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-action'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pango07/quod-action
          ref: exp/whole-job-e-codex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm install --no-audit --no-fund && npm run build
      - run: node --test src/*.test.js
      - run: npm install --no-audit --no-fund
        working-directory: test
      - uses: ./
        with:
          dependencies: 'false'
          cloud: 'false'
          task-cache: 'false'
          lineage-witness: 'true'
      - name: Real vitest lineage and switch regression
        working-directory: test
        run: |
          set -eo pipefail
          npm test
          node --input-type=module -e '
            import fs from "node:fs";
            const root=process.env.RUNNER_TEMP+"/quod/vitest";
            for(const d of fs.readdirSync(root)){const p=root+"/"+d+"/ledger.json";if(fs.existsSync(p)){const l=JSON.parse(fs.readFileSync(p));l.facts.vitest="stale-toolchain";fs.writeFileSync(p,JSON.stringify(l));}}
          '
          npm test
          node --input-type=module -e '
            import fs from "node:fs";
            const root=process.env.RUNNER_TEMP+"/quod/vitest";
            for(const d of fs.readdirSync(root)){const p=root+"/"+d+"/ledger.json";if(fs.existsSync(p)&&Object.keys(JSON.parse(fs.readFileSync(p)).files).length)throw Error("stale plain witness survived a toolchain change");}
          '
          npm test
          npm test
          cp "$RUNNER_TEMP"/quod/vitest/*/ledger.json /tmp/lineage-before.json
          echo '// changed input, same tests' >> src/math.js
          npm test 2>&1 | tee /tmp/lineage-promote.log
          cp "$RUNNER_TEMP"/quod/vitest/*/ledger.json /tmp/lineage-after.json
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("/tmp/lineage-before.json")), q=JSON.parse(fs.readFileSync("/tmp/lineage-after.json"));
            const names=(l,ds)=>ds.map(i=>l.keys[i]).sort();
            console.log("context",JSON.stringify({facts:[p.facts,q.facts],args:[p.args,q.args],globalAdded:names(q,q.global).filter(k=>!names(p,p.global).includes(k)),globalRemoved:names(p,p.global).filter(k=>!names(q,q.global).includes(k))}));
            for(const [id,r] of Object.entries(q.files)) { const old=p.files[id]; console.log("record",JSON.stringify({file:r.file,plain_n:old?.plain_n,w:[old?.w,r.w],near:r.near_timeout,net:r.net,added:names(q,r.deps).filter(k=>!names(p,old.deps).includes(k)),removed:names(p,old.deps).filter(k=>!names(q,r.deps).includes(k))})); }
          '
          grep -E 'lineage: [1-9][0-9]* promoted' /tmp/lineage-promote.log
          npm test 2>&1 | tee /tmp/lineage-audit.log
          grep -E 'lineage: [0-9]+ promoted, [1-9][0-9]* plain audits, 0 disagreed' /tmp/lineage-audit.log
          node --input-type=module -e '
            import fs from "node:fs";
            const root=process.env.RUNNER_TEMP+"/quod/vitest";
            for(const d of fs.readdirSync(root)){const p=root+"/"+d+"/ledger.json";if(fs.existsSync(p)&&Object.values(JSON.parse(fs.readFileSync(p)).files).filter(r=>r.lineage).length!==1)throw Error("opportunistic audit consumed a pending plain lineage audit");}
          '
          QUOD_VITEST_LINEAGE=0 npm test 2>&1 | tee /tmp/lineage-off.log
          grep -E 'plain:' /tmp/lineage-off.log
      - name: Bundle artifact
        run: tar -czf /tmp/quod-action-dist.tgz dist/main dist/post
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: benchmark-action
          path: |
            /tmp/quod-action-dist.tgz
            /tmp/lineage-*.log

  benchmark-profile:
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'benchmark-profile' || inputs.only == 'benchmark-profile-full' || inputs.only == 'benchmark-profile-caller')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ inputs.only == 'benchmark-profile-caller' && fromJSON('["caller"]') || inputs.only == 'benchmark-profile-full' && fromJSON('["full"]') || fromJSON('["all","preload","env"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pango07/quod-action
          ref: 4caade95c887a6962a040089a6787ef32a7dfaf2
          path: profile-action
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 6b17e1514f5222e9c019e177e36384df95a3ff25
          path: profile-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci
        working-directory: profile-project
      - name: Profile plain and recording on the same runner
        env:
          PROFILE_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p /tmp/quod-profile
          tar -xzf profile-action/dist/quod/bin-8dc6916.tar.gz -C /tmp/quod-profile
          python3 scripts/bench-vitest/convex-profile.py "$PWD/profile-project" "$PROFILE_MODE"
          if [ "$PROFILE_MODE" = full ]; then node scripts/bench-vitest/cpuprof-summary.mjs /tmp/quod-profile/evidence/cpu 20; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: convex-profile-${{ matrix.mode }}
          path: /tmp/quod-profile/evidence
