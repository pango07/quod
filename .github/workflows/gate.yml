# The heavy gates on GitHub's runners instead of the dev VM: lint, the merge
# gate, the hooks acceptance suite and the CLI acceptance corpora (cli/cli,
# luxon, starlette). Every gate is one `scripts/ci-gate.sh` command, the same
# one the dev box runs. docs/ci.md says what each job proves, how long it
# takes, what is cached and why, and the minute budget.
#
#   gh workflow run gate.yml --ref <branch>                 # every job
#   gh workflow run gate.yml --ref <branch> -f only=hooks,acceptance-cli
#   gh run watch
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ['exp/**', 'fix/**', 'cloud/**', 'ci/**']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to gate (default the ref the workflow runs on; it must contain scripts/ci-gate.sh)
        required: false
        default: ''
      only:
        description: "Comma-separated jobs, or all: lint, merge-gate, hooks, acceptance-cli, acceptance-node, acceptance-python, cloud"
        required: false
        default: all

concurrency:
  group: gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  QUOD_GATE_LOGS: ${{ github.workspace }}/target/gate-logs

jobs:
  # Which jobs this event runs. Rust gates run when anything outside cloud/
  # changed; the cloud job when cloud/ changed. A dispatch runs what `only`
  # names, whatever changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.pick.outputs.lint }}
      merge-gate: ${{ steps.pick.outputs.merge-gate }}
      hooks: ${{ steps.pick.outputs.hooks }}
      acceptance-cli: ${{ steps.pick.outputs.acceptance-cli }}
      acceptance-node: ${{ steps.pick.outputs.acceptance-node }}
      acceptance-python: ${{ steps.pick.outputs.acceptance-python }}
      cloud: ${{ steps.pick.outputs.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          core=false cloud=false
          case "$EVENT" in
            workflow_dispatch) core=true cloud=true;;
            pull_request) files=$(git diff --name-only "$BASE...$HEAD");;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE
              else base=$(git merge-base origin/main HEAD); fi
              files=$(git diff --name-only "$base" HEAD);;
          esac
          if [ "$EVENT" != workflow_dispatch ] && [ -n "${files:-}" ]; then
            printf 'changed:\n%s\n' "${files:-(none)}" | head -50
            if grep -qv '^cloud/' <<<"$files"; then core=true; fi
            if grep -q '^cloud/' <<<"$files"; then cloud=true; fi
          fi
          want() { [ "$ONLY" = all ] || [[ ",${ONLY// /}," == *",$1,"* ]]; }
          for j in lint merge-gate hooks acceptance-cli acceptance-node acceptance-python; do
            r=false; [ "$core" = true ] && want "$j" && r=true
            echo "$j=$r" | tee -a "$GITHUB_OUTPUT"
          done
          r=false; [ "$cloud" = true ] && want cloud && r=true
          echo "cloud=$r" | tee -a "$GITHUB_OUTPUT"

  # fmt, clippy (default and all features), every workspace test with
  # QUOD_INTEGRATION=1 as root, with every corpus toolchain installed, as the
  # dev container runs scripts/lint.sh.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUOD_INTEGRATION: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
      - run: scripts/ci-gate.sh lint
      - if: always()
        run: scripts/ci-gate.sh summary lint >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-logs
          path: target/gate-logs/
          retention-days: 14

  # The ring suites (uring, ring_faults, faults and observer_faults with
  # their ring cases, transports_log_identically). lint runs as its own job,
  # so the merge gate here skips it; without the ring it skips the ring
  # suites with a message and runs the classic cases.
  merge-gate:
    needs: changes
    if: needs.changes.outputs.merge-gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUOD_INTEGRATION: 1
      QUOD_GATE_SKIP_LINT: 1
      QUOD_RING_OPTIONAL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: merge-gate
          cache-on-failure: true
      - run: scripts/ci-gate.sh merge-gate
      - if: always()
        run: scripts/ci-gate.sh summary merge-gate >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-gate-logs
          path: target/gate-logs/
          retention-days: 14

  # A1-A7 (+A7b), trust, secrets and the served git index through the
  # hooks path (tests/hooks_acceptance.rs) on cli/cli at its pinned commit,
  # jobs seeded from the checkout's .quod/gomod.
  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: hooks
      corpus: hooks
      toolchains: go
      timeout: 120
      ref: ${{ inputs.ref || '' }}

  # scripts/acceptance.sh per corpus: step A, A1-A7 (+A7b, W1-W4 where the
  # profile has warm state), the trust suite (T1-T11) and T7.
  acceptance-cli:
    needs: changes
    if: needs.changes.outputs.acceptance-cli == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: go
      toolchains: go
      timeout: 150
      ref: ${{ inputs.ref || '' }}

  acceptance-node:
    needs: changes
    if: needs.changes.outputs.acceptance-node == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: node
      toolchains: go node
      timeout: 75
      ref: ${{ inputs.ref || '' }}

  acceptance-python:
    needs: changes
    if: needs.changes.outputs.acceptance-python == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: python
      toolchains: go python
      timeout: 75
      ref: ${{ inputs.ref || '' }}

  # cloud/ (the Next.js dashboard): its own checks, only when it changed.
  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - id: node
        working-directory: .
        run: echo "version=$(sed -n '/^\[node\]/,/^\[/s/^version = "\(.*\)"/\1/p' versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
