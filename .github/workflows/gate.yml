  benchmark-native-inspector:
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'benchmark-native-inspector' || inputs.only == 'benchmark-native-api' || inputs.only == 'benchmark-native-string' || inputs.only == 'benchmark-native-property' || inputs.only == 'benchmark-stat-constructor')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - name: Inspect exported native debugger APIs
        shell: bash
        run: |
          nm -D --defined-only "$(command -v node)" | c++filt > "$RUNNER_TEMP/quod-node-exports.txt"
          python3 - "$RUNNER_TEMP/quod-node-exports.txt" <<'PY'
          import json, sys
          symbols=open(sys.argv[1]).read().splitlines()
          names=['v8::debug::GetInspector(', 'v8::debug::SetDebugDelegate(',
                 'v8::debug::SetFunctionBreakpoint(', 'v8::debug::RemoveBreakpoint(',
                 'v8::debug::GetLoadedScripts(', 'node::inspector::Agent::Connect(',
                 'v8_inspector::V8ContextInfo::executionContextId(']
          print(json.dumps({name:[line.split(' ',2)[-1] for line in symbols if name in line] for name in names},indent=2))
          PY
      - name: Build isolated native Inspector experiment
        if: inputs.only == 'benchmark-native-inspector' || inputs.only == 'benchmark-native-string' || inputs.only == 'benchmark-native-property' || inputs.only == 'benchmark-stat-constructor'
        shell: bash
        run: |
          NODE_INCLUDE="$(node -p 'require("node:path").resolve(process.execPath,"../../include/node")')"
          HEADER_DIR="$RUNNER_TEMP/quod-inspector-headers"
          mkdir -p "$HEADER_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/nodejs/node/v24.18.0/deps/v8/include/v8-inspector.h \
            --output "$HEADER_DIR/v8-inspector.h"
          echo "02de3f8668a07ed2f6745908765efe1e69ba66a0361a33632f30283406fc1b28  $HEADER_DIR/v8-inspector.h" | sha256sum --check -
          c++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter \
            -I "$HEADER_DIR" -isystem "$NODE_INCLUDE" -DNODE_GYP_MODULE_NAME=quod_native_capture \
            scripts/bench-vitest/native-entry-capture.cc -ldl -o "$RUNNER_TEMP/quod-native-capture.node"
          c++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter \
            -I "$HEADER_DIR" -isystem "$NODE_INCLUDE" -DNODE_GYP_MODULE_NAME=quod_native_inspector \
            -DQUOD_NATIVE_INSPECTOR_EXPERIMENT scripts/bench-vitest/native-entry-capture.cc \
            -ldl -o "$RUNNER_TEMP/quod-native-inspector.node"
          echo "QUOD_NATIVE_CAPTURE_ADDON=$RUNNER_TEMP/quod-native-capture.node" >> "$GITHUB_ENV"
          echo "QUOD_NATIVE_INSPECTOR_ADDON=$RUNNER_TEMP/quod-native-inspector.node" >> "$GITHUB_ENV"
      - name: Verify direct capture and measure the two transports
        if: inputs.only == 'benchmark-native-inspector' || inputs.only == 'benchmark-native-string'
        env:
          QUOD_NATIVE_CAPTURE_TRANSPORT: ${{ inputs.only == 'benchmark-native-string' && 'string' || 'native' }}
        run: node --test scripts/bench-vitest/native-inspector-capture.test.mjs scripts/bench-vitest/native-capture-summary.test.mjs scripts/bench-vitest/native-context-guard.test.mjs
      - name: Exercise primitive transport through the integrated observer
        if: inputs.only == 'benchmark-native-string'
        env:
          QUOD_TEST_NATIVE_CAPTURE_TRANSPORT: string
        run: node --test scripts/bench-vitest/descriptor-access-probe.test.mjs
      - name: Inventory native data-property semantics without enabling instrumentation
        if: inputs.only == 'benchmark-native-property' || inputs.only == 'benchmark-stat-constructor'
        run: node --test --test-reporter=tap scripts/bench-vitest/native-data-property-semantics.test.mjs scripts/bench-vitest/native-scalar-capture.test.mjs scripts/bench-vitest/native-scalar-property-probe.test.mjs scripts/bench-vitest/native-context-guard.test.mjs scripts/bench-vitest/native-stat-fields.test.mjs scripts/bench-vitest/stat-constructor-probe.test.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.only == 'benchmark-stat-constructor'
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
          persist-credentials: false
      - name: Install the unchanged workload
        if: inputs.only == 'benchmark-stat-constructor'
        working-directory: profile-project
        run: npm ci && npm run build
      - name: Measure constructor observation around the expensive test
        if: inputs.only == 'benchmark-stat-constructor'
        run: python3 scripts/bench-vitest/stat-constructor-workload.py "$PWD/profile-project" "$RUNNER_TEMP/stat-constructor-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.only == 'benchmark-stat-constructor'
        with:
          name: stat-constructor-workload
          path: ${{ runner.temp }}/stat-constructor-evidence
      - name: Capture native scalar integration crash backtrace
        if: failure() && inputs.only == 'benchmark-native-property'
        run: |
          ulimit -c 0
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
          gdb --batch --return-child-result -ex run -ex 'thread apply all bt 30' \
            --args node scripts/bench-vitest/native-scalar-property-probe.test.mjs

  # Fast IPC regression gate; the worker-boundary gate still runs these
  # checks before its complete convex-helpers workload.
  benchmark-ipc-delivery:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-ipc-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - name: Build the native IPC field observer
        shell: bash
        run: |
          NODE_INCLUDE="$(node -p 'require("node:path").resolve(process.execPath,"../../include/node")')"
          HEADER_DIR="$RUNNER_TEMP/quod-inspector-headers"
          mkdir -p "$HEADER_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/nodejs/node/v24.18.0/deps/v8/include/v8-inspector.h \
            --output "$HEADER_DIR/v8-inspector.h"
          echo "02de3f8668a07ed2f6745908765efe1e69ba66a0361a33632f30283406fc1b28  $HEADER_DIR/v8-inspector.h" | sha256sum --check -
          c++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter \
            -I "$HEADER_DIR" -isystem "$NODE_INCLUDE" -DNODE_GYP_MODULE_NAME=quod_native_capture \
            scripts/bench-vitest/native-entry-capture.cc -ldl -o "$RUNNER_TEMP/quod-native-capture.node"
          echo "QUOD_NATIVE_CAPTURE_ADDON=$RUNNER_TEMP/quod-native-capture.node" >> "$GITHUB_ENV"
      - run: node --test scripts/bench-vitest/ipc-delivery-probe.test.mjs scripts/bench-vitest/worker-startup-probe.test.mjs scripts/bench-vitest/message-dispatch-probe.test.mjs

  benchmark-worker-inputs:
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'benchmark-worker-inputs' || inputs.only == 'benchmark-worker-config' || inputs.only == 'benchmark-worker-capabilities' || inputs.only == 'benchmark-worker-arguments' || inputs.only == 'benchmark-worker-modules' || inputs.only == 'benchmark-worker-module-fixtures' || inputs.only == 'benchmark-worker-module-metadata' || inputs.only == 'benchmark-worker-boundary')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.only == 'benchmark-worker-boundary' && 35 || 12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.only != 'benchmark-worker-arguments' && inputs.only != 'benchmark-worker-module-fixtures'
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - name: Build the diagnostic native capture helper
        if: inputs.only == 'benchmark-worker-boundary' || inputs.only == 'benchmark-worker-module-fixtures' || inputs.only == 'benchmark-worker-module-metadata'
        shell: bash
        run: |
          NODE_INCLUDE="$(node -p 'require("node:path").resolve(process.execPath,"../../include/node")')"
          test -f "$NODE_INCLUDE/node.h"
          HEADER_DIR="$RUNNER_TEMP/quod-inspector-headers"
          mkdir -p "$HEADER_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/nodejs/node/v24.18.0/deps/v8/include/v8-inspector.h \
            --output "$HEADER_DIR/v8-inspector.h"
          echo "02de3f8668a07ed2f6745908765efe1e69ba66a0361a33632f30283406fc1b28  $HEADER_DIR/v8-inspector.h" | sha256sum --check -
          c++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter \
            -I "$HEADER_DIR" -isystem "$NODE_INCLUDE" -DNODE_GYP_MODULE_NAME=quod_native_capture \
            scripts/bench-vitest/native-entry-capture.cc -ldl -o "$RUNNER_TEMP/quod-native-capture.node"
          sha256sum "$RUNNER_TEMP/quod-native-capture.node"
          echo "QUOD_NATIVE_CAPTURE_ADDON=$RUNNER_TEMP/quod-native-capture.node" >> "$GITHUB_ENV"
          c++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter \
            -I "$HEADER_DIR" -isystem "$NODE_INCLUDE" -DNODE_GYP_MODULE_NAME=quod_native_capture \
            -DQUOD_CAPTURE_DESCRIPTOR_FIELDS scripts/bench-vitest/native-entry-capture.cc \
            -ldl -o "$RUNNER_TEMP/quod-native-capture-descriptors.node"
          echo "QUOD_NATIVE_CAPTURE_DESCRIPTOR_ADDON=$RUNNER_TEMP/quod-native-capture-descriptors.node" >> "$GITHUB_ENV"
      - run: node --test scripts/bench-vitest/worker-input-probe.test.mjs scripts/bench-vitest/test-progress-reporter.test.mjs
      - run: node --test scripts/bench-vitest/worker-config-probe.test.mjs
        if: inputs.only != 'benchmark-worker-inputs' && inputs.only != 'benchmark-worker-modules' && inputs.only != 'benchmark-worker-module-fixtures' && inputs.only != 'benchmark-worker-module-metadata'
      - run: node --test scripts/bench-vitest/worker-module-probe.test.mjs scripts/bench-vitest/script-metadata-index.test.mjs scripts/bench-vitest/script-id-ranges.test.mjs scripts/bench-vitest/compiled-source-cache.test.mjs scripts/bench-vitest/compiled-block-log.test.mjs scripts/bench-vitest/issued-compilation-sources.test.mjs
        if: inputs.only == 'benchmark-worker-modules' || inputs.only == 'benchmark-worker-module-fixtures' || inputs.only == 'benchmark-worker-boundary'
      - run: node --test scripts/bench-vitest/worker-module-metadata-probe.test.mjs scripts/bench-vitest/worker-transport-metadata-probe.test.mjs scripts/bench-vitest/metadata-reader-source.test.mjs
        if: inputs.only == 'benchmark-worker-module-metadata' || inputs.only == 'benchmark-worker-module-fixtures' || inputs.only == 'benchmark-worker-boundary'
      - run: node --test scripts/bench-vitest/promise-observers-probe.test.mjs scripts/bench-vitest/hook-access-probe.test.mjs scripts/bench-vitest/inspector-access-probe.test.mjs scripts/bench-vitest/message-dispatch-probe.test.mjs scripts/bench-vitest/transport-continuation-probe.test.mjs scripts/bench-vitest/ipc-delivery-probe.test.mjs scripts/bench-vitest/worker-startup-probe.test.mjs
        if: inputs.only == 'benchmark-worker-module-metadata' || inputs.only == 'benchmark-worker-module-fixtures' || inputs.only == 'benchmark-worker-boundary'
      - run: node --test scripts/bench-vitest/opaque-observers-probe.test.mjs scripts/bench-vitest/heap-observers-probe.test.mjs scripts/bench-vitest/proxy-observers-probe.test.mjs
        if: inputs.only == 'benchmark-worker-capabilities' || inputs.only == 'benchmark-worker-arguments' || inputs.only == 'benchmark-worker-module-metadata' || inputs.only == 'benchmark-worker-boundary'
      - run: node --test scripts/bench-vitest/worker-boundary-probe.test.mjs scripts/bench-vitest/scalar-property-probe.test.mjs scripts/bench-vitest/descriptor-access-probe.test.mjs scripts/bench-vitest/native-handle-lifetime.test.mjs scripts/bench-vitest/heap-native-identity-probe.test.mjs scripts/bench-vitest/native-module-scope.test.mjs scripts/bench-vitest/native-module-identity.test.mjs scripts/bench-vitest/native-entry-arguments.test.mjs scripts/bench-vitest/native-entry-log.test.mjs scripts/bench-vitest/native-capture-summary.test.mjs
        if: inputs.only == 'benchmark-worker-boundary' || inputs.only == 'benchmark-worker-module-fixtures'
      - name: Verify selected primitive transport before the full workload
        if: inputs.only == 'benchmark-worker-boundary' && inputs.native_transport == 'string'
        env:
          QUOD_TEST_NATIVE_CAPTURE_TRANSPORT: string
          QUOD_NATIVE_CAPTURE_TRANSPORT: string
        run: node --test scripts/bench-vitest/native-inspector-capture.test.mjs scripts/bench-vitest/descriptor-access-probe.test.mjs
      - name: Verify direct native scalar observation before the full workload
        if: inputs.only == 'benchmark-worker-boundary' && inputs.scalar_observation == 'native-data'
        run: node --test scripts/bench-vitest/native-scalar-capture.test.mjs scripts/bench-vitest/native-scalar-property-probe.test.mjs
      - run: npm ci
        if: inputs.only != 'benchmark-worker-arguments' && inputs.only != 'benchmark-worker-module-fixtures'
        working-directory: profile-project
      - name: Compare worker inputs across a metadata-only change
        if: inputs.only != 'benchmark-worker-arguments' && inputs.only != 'benchmark-worker-module-fixtures'
        env:
          QUOD_WORKER_BOUNDARY_PROBE: ${{ inputs.only == 'benchmark-worker-boundary' && '1' || '0' }}
          QUOD_WORKER_NATIVE_CAPTURE_TRANSPORT: ${{ inputs.native_transport || 'protocol' }}
          QUOD_WORKER_SCALAR_OBSERVATION: ${{ inputs.scalar_observation || 'accessor' }}
          QUOD_WORKER_CONFIG_PROBE: ${{ (inputs.only == 'benchmark-worker-config' || inputs.only == 'benchmark-worker-capabilities') && '1' || '0' }}
          QUOD_WORKER_CONFIG_NATIVE_PROBE: ${{ inputs.only == 'benchmark-worker-capabilities' && '1' || '0' }}
          QUOD_WORKER_MODULE_PROBE: ${{ inputs.only == 'benchmark-worker-modules' && '1' || '0' }}
          QUOD_WORKER_MODULE_METADATA_PROBE: ${{ inputs.only == 'benchmark-worker-module-metadata' && '1' || '0' }}
        run: node scripts/bench-vitest/driver-worker-input-probe.mjs "$PWD/profile-project" /tmp/quod-worker-inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.only != 'benchmark-worker-arguments' && inputs.only != 'benchmark-worker-module-fixtures'
        with:
          name: benchmark-worker-inputs
          path: /tmp/quod-worker-inputs

  benchmark-config:
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'benchmark-config' || inputs.only == 'benchmark-resolver' || inputs.only == 'benchmark-boolean' || startsWith(inputs.only, 'benchmark-query'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
          fetch-depth: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci
        working-directory: profile-project
      - name: Measure configuration output across declaration changes
        env:
          QUOD_CONFIG_RESOLVER_PROBE: ${{ (inputs.only == 'benchmark-resolver' || inputs.only == 'benchmark-boolean' || startsWith(inputs.only, 'benchmark-query')) && '1' || '0' }}
          QUOD_CONFIG_BOOLEAN_PROBE: ${{ (inputs.only == 'benchmark-boolean' || startsWith(inputs.only, 'benchmark-query')) && '1' || '0' }}
          QUOD_CONFIG_QUERY_PROBE: ${{ startsWith(inputs.only, 'benchmark-query') && '1' || '0' }}
          QUOD_CONFIG_QUERY_SITES: ${{ (inputs.only == 'benchmark-query-sites' || inputs.only == 'benchmark-query-async' || startsWith(inputs.only, 'benchmark-query-runtime')) && '1' || '0' }}
          QUOD_CONFIG_ASYNC_SITES: ${{ inputs.only == 'benchmark-query-async' && '1' || '0' }}
          QUOD_CONFIG_RUNTIME_SITES: ${{ startsWith(inputs.only, 'benchmark-query-runtime') && '1' || '0' }}
          QUOD_CONFIG_ASYNC_STAT_SITES: ${{ inputs.only == 'benchmark-query-runtime-stat' && '1' || '0' }}
        run: node scripts/bench-vitest/config-stage-probe.mjs "$PWD/profile-project" /tmp/quod-config-probe
      - name: Async consumer syntax and escape regressions
        if: inputs.only == 'benchmark-query-async'
        run: node --test crates/quod-cli/src/vitest/async-json-proof.test.mjs
      - name: Boolean-context proof adversarial regressions
        if: inputs.only == 'benchmark-boolean' || startsWith(inputs.only, 'benchmark-query')
        run: node --test crates/quod-cli/src/vitest/boolean-proof.test.mjs
      - name: Passive promise observer diagnostic regressions
        if: inputs.only == 'benchmark-query-runtime-stat'
        run: node --test scripts/bench-vitest/promise-observers-probe.test.mjs scripts/bench-vitest/async-stat-probe.test.mjs
      - name: Config proof regression tests
        if: inputs.only == 'benchmark-config'
        run: node --test crates/quod-cli/src/vitest/names-proof.test.mjs
      - name: Verify proof against actual Vite-loaded configuration
        if: inputs.only == 'benchmark-config'
        env:
          QUOD_CONFIG_NAMES_PROOF: '1'
        run: node scripts/bench-vitest/config-stage-probe.mjs "$PWD/profile-project" /tmp/quod-config-probe/proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: benchmark-config
          path: /tmp/quod-config-probe

  # Research only: hardening must pass before recording or consuming receipts.
  managed-replay-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-managed-replay'
    needs: benchmark-managed-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      receipt_sha256: ${{ steps.seed.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/bench-vitest/managed
      - run: npm ci --no-audit --no-fund
        working-directory: profile-project
      - name: Receipt mutation and failure admission matrix
        run: node scripts/bench-vitest/managed/receipt-fixtures.mjs "$RUNNER_TEMP/receipt-checks"
      - name: Record sealed managed execution
        id: seed
        run: node scripts/bench-vitest/managed/replay-probe.mjs seed "$PWD/profile-project" "$RUNNER_TEMP/seed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: managed-replay-seed
          path: |
            ${{ runner.temp }}/seed
            ${{ runner.temp }}/receipt-checks

  managed-replay-control:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-managed-replay'
    needs: benchmark-managed-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/bench-vitest/managed
      - run: npm ci --no-audit --no-fund
        working-directory: profile-project
      - name: Independent uncached managed control
        run: node scripts/bench-vitest/managed/replay-probe.mjs control "$PWD/profile-project" "$RUNNER_TEMP/control"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: managed-replay-control
          path: ${{ runner.temp }}/control

  managed-replay-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'benchmark-managed-replay'
    needs: [managed-replay-seed, managed-replay-control]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/bench-vitest/managed
      - run: npm ci --no-audit --no-fund
        working-directory: profile-project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-replay-seed
          path: ${{ runner.temp }}/download-seed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-replay-control
          path: ${{ runner.temp }}/download-control
      - name: Recompile and validate receipt on third fresh runner
        env:
          TRUSTED_RECEIPT_SHA256: ${{ needs['managed-replay-seed'].outputs.receipt_sha256 }}
        run: >-
          node scripts/bench-vitest/managed/replay-probe.mjs replay
          "$PWD/profile-project" "$RUNNER_TEMP/replay"
          "$RUNNER_TEMP/download-seed/seed/receipt.json" "$TRUSTED_RECEIPT_SHA256"
          "$RUNNER_TEMP/download-control/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: managed-replay-consumer
          path: ${{ runner.temp }}/replay

  # Small real-dispatcher gate. Ordinary fallback outcomes and an authenticated
  # receipt hit are checked before spending a full history window on runners.
  benchmark-managed-dispatcher:
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'benchmark-managed-dispatcher' || inputs.only == 'benchmark-managed-product')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          path: profile-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/bench-vitest/managed
      - run: npm ci --no-audit --no-fund
        working-directory: profile-project
      - name: Real dispatcher receipt, failure, and ordinary fallback controls
        run: node scripts/bench-vitest/managed/dispatcher-integration.mjs "$PWD/profile-project" "$RUNNER_TEMP/managed-dispatcher"
      - name: Independently audit dispatcher controls
        run: python3 scripts/bench-vitest/managed/dispatcher-audit.py "$RUNNER_TEMP/managed-dispatcher"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: managed-dispatcher
          path: ${{ runner.temp }}/managed-dispatcher
