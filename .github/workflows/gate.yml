# The heavy gates on GitHub's runners instead of the dev VM: lint, the merge
# gate, the hooks acceptance suite and the CLI acceptance corpora (cli/cli,
# luxon, starlette), and bench-lite, the fast benchmark. Every gate is one
# `scripts/ci-gate.sh` command, the same one the dev box runs. docs/ci.md says
# what each job proves, how long it takes, what is cached and why, when each
# runs (the trigger policy) and the minute budget.
#
# Gates run at milestones (a dispatch) and on pull requests to main, never on
# a branch push: the private repository's minutes are billed.
#
#   gh workflow run gate.yml --ref <branch>                 # every job
#   gh workflow run gate.yml --ref <branch> -f only=lint
#   gh workflow run gate.yml --ref <branch> -f only=hooks,acceptance-cli
#   gh run watch
name: gate

on:
  # Pull requests to main, once they are ready (drafts skip): the fast gates
  # whose paths changed. Docs, web/ and Markdown alone start nothing.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore: ['docs/**', 'web/**', '**/*.md']
  # A merge to main that touched Rust: refreshes main's Rust caches, which
  # every pull request and dispatch restores (a branch cannot read another
  # branch's caches, only main's). A job whose cache is current stops after
  # the restore; on a miss it runs its gate, which saves the cache.
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'web/**', 'cloud/**', '**/*.md']
  # The milestone gate.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to gate (default the ref the workflow runs on; it must contain scripts/ci-gate.sh)
        required: false
        default: ''
      only:
        description: "Comma-separated jobs, or all: lint, merge-gate, bench-lite, hooks, acceptance-cli, acceptance-node, acceptance-python, cloud; bench-real and landing only when named"
        required: false
        default: all
      bench_real:
        description: "bench-real's arguments (scripts/bench-real.sh), e.g. --repos go --n 5"
        required: false
        default: ''

concurrency:
  # A dispatch is grouped by what it runs too, so dispatching bench-real (or
  # a corpus gate) neither cancels nor is cancelled by another dispatch.
  group: gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.only || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # File and line in backtraces, no full debuginfo: debug builds and the
  # ~20 test binaries' links are faster and the caches smaller. Part of the
  # rust-cache key (it hashes CARGO_* variables).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  QUOD_GATE_LOGS: ${{ github.workspace }}/target/gate-logs

jobs:
  # Which jobs this event runs (docs/ci.md, "Triggers"):
  #   pull_request  lint, merge-gate and bench-lite if a Rust-relevant path
  #                 changed (anything but cloud/, web/, docs/, Markdown and
  #                 the other workflows), cloud if cloud/ changed. Hooks and
  #                 the corpus gates only by dispatch, at milestones.
  #   push (main)   lint, merge-gate and bench-lite in cache mode (seed=true):
  #                 each stops after its cache restore when the cache is current.
  #   dispatch      what `only` names (default all), whatever changed.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.pick.outputs.seed }}
      lint: ${{ steps.pick.outputs.lint }}
      merge-gate: ${{ steps.pick.outputs.merge-gate }}
      bench-lite: ${{ steps.pick.outputs.bench-lite }}
      bench-real: ${{ steps.pick.outputs.bench-real }}
      hooks: ${{ steps.pick.outputs.hooks }}
      acceptance-cli: ${{ steps.pick.outputs.acceptance-cli }}
      acceptance-node: ${{ steps.pick.outputs.acceptance-node }}
      acceptance-python: ${{ steps.pick.outputs.acceptance-python }}
      cloud: ${{ steps.pick.outputs.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          core=false cloud=false seed=false files=
          case "$EVENT" in
            workflow_dispatch) core=true cloud=true;;
            pull_request)
              ONLY=lint,merge-gate,bench-lite,cloud
              files=$(git diff --name-only "$BASE...$HEAD");;
            push)
              ONLY=lint,merge-gate,bench-lite seed=true
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; else base=HEAD^; fi
              files=$(git diff --name-only "$base" HEAD);;
          esac
          if [ "$EVENT" != workflow_dispatch ]; then
            printf 'changed:\n%s\n' "${files:-(none)}" | head -50
            # Paths that cannot change a Rust gate's result.
            not_rust='^(cloud/|web/|docs/)|\.md$|^\.github/workflows/(ci|quod-cloud|quod-release|bench-[a-z-]+)\.yml$|^\.github/actions/setup/'
            if [ -n "$files" ] && grep -qvE "$not_rust" <<<"$files"; then core=true; fi
            if [ -n "$files" ] && grep -q '^cloud/' <<<"$files"; then cloud=true; fi
            echo "Rust gates: $core, cloud: $cloud"
          fi
          echo "seed=$seed" | tee -a "$GITHUB_OUTPUT"
          want() { [ "$ONLY" = all ] || [[ ",${ONLY// /}," == *",$1,"* ]]; }
          for j in lint merge-gate bench-lite hooks acceptance-cli acceptance-node acceptance-python; do
            r=false; [ "$core" = true ] && want "$j" && r=true
            echo "$j=$r" | tee -a "$GITHUB_OUTPUT"
          done
          r=false; [ "$cloud" = true ] && want cloud && r=true
          echo "cloud=$r" | tee -a "$GITHUB_OUTPUT"
          # bench-real (~1-2 h here) runs only when a dispatch names it.
          r=false; [ "$EVENT" = workflow_dispatch ] && [[ ",${ONLY// /}," == *",bench-real,"* ]] && r=true
          echo "bench-real=$r" | tee -a "$GITHUB_OUTPUT"

  # fmt, clippy (default and all features), every workspace test with
  # QUOD_INTEGRATION=1 as root, with every corpus toolchain installed, as the
  # dev container runs scripts/lint.sh. Its log times each phase.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QUOD_INTEGRATION: 1
      # Pull requests: unit tests only (~4 min). Milestone dispatches also run the integration tests.
      QUOD_LINT_TESTS: ${{ github.event_name == 'pull_request' && 'unit' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
      # On a push to main, only when main's cache is not current.
      - id: gate
        if: needs.changes.outputs.seed != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-gate.sh lint
      - if: always() && steps.gate.outcome != 'skipped'
        run: scripts/ci-gate.sh summary lint >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-logs
          path: target/gate-logs/
          retention-days: 14

  # The ring suites (uring, ring_faults, faults and observer_faults with
  # their ring cases, transports_log_identically). lint runs as its own job,
  # so the merge gate here skips it; without the ring it skips the ring
  # suites with a message and runs the classic cases.
  merge-gate:
    needs: changes
    if: needs.changes.outputs.merge-gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUOD_INTEGRATION: 1
      QUOD_GATE_SKIP_LINT: 1
      QUOD_RING_OPTIONAL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: merge-gate
          cache-on-failure: true
      # On a push to main, only when main's cache is not current.
      - id: gate
        if: needs.changes.outputs.seed != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-gate.sh merge-gate
      - if: always() && steps.gate.outcome != 'skipped'
        run: scripts/ci-gate.sh summary merge-gate >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-gate-logs
          path: target/gate-logs/
          retention-days: 14

  # The fast benchmark (scripts/bench-lite.sh, docs/bench/lite-baseline.md):
  # a generated Go + Node + Python monorepo's 18 jobs, plain and through
  # quod run / quod step, interleaved; every replay compared with the plain
  # run of the same tree. Fails on any wrong replay. The table goes to the
  # job summary with the deltas against docs/bench/lite-baseline.json; the
  # rows and the summary JSON are uploaded.
  bench-lite:
    needs: changes
    if: needs.changes.outputs.bench-lite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
      # On a push to main, only when main's cache is not current.
      - id: gate
        if: needs.changes.outputs.seed != 'true' || steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-gate.sh bench-lite --against main
      - if: always() && steps.gate.outcome != 'skipped'
        run: |
          if [ -f .bench-lite/table.md ]; then
            { echo '### bench-lite'; echo; cat .bench-lite/table.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            scripts/ci-gate.sh summary bench-lite >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-lite
          path: |
            .bench-lite/
            target/gate-logs/
          include-hidden-files: true
          retention-days: 30

  # bench-real-small (scripts/bench-real.sh, docs/bench/real-small.md): Quod
  # against plain on three small real repos' last 20 first-parent commits,
  # history and PR traffic, every replay spot-checked. Dispatch only:
  #   gh workflow run gate.yml --ref <branch> -f only=bench-real
  # ubuntu-latest has 2 vCPUs for a private repository (4 for a public one).
  bench-real:
    needs: changes
    if: needs.changes.outputs.bench-real == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: go node python
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
      - env:
          ARGS: ${{ inputs.bench_real }}
        run: scripts/ci-gate.sh bench-real $ARGS
      - if: always()
        run: |
          if [ -f .bench-real/report.md ]; then cat .bench-real/report.md >> "$GITHUB_STEP_SUMMARY"
          else scripts/ci-gate.sh summary bench-real >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-real
          path: |
            .bench-real/
            target/gate-logs/
          include-hidden-files: true
          retention-days: 90

  # A1-A7 (+A7b), trust, secrets and the served git index through the
  # hooks path (tests/hooks_acceptance.rs) on cli/cli at its pinned commit,
  # jobs seeded from the checkout's .quod/gomod.
  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: hooks
      corpus: hooks
      toolchains: go
      timeout: 75
      ref: ${{ inputs.ref || '' }}

  # scripts/acceptance.sh per corpus: step A, A1-A7 (+A7b, W1-W4 where the
  # profile has warm state), the trust suite (T1-T11) and T7.
  acceptance-cli:
    needs: changes
    if: needs.changes.outputs.acceptance-cli == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: go
      toolchains: go
      timeout: 150
      ref: ${{ inputs.ref || '' }}

  acceptance-node:
    needs: changes
    if: needs.changes.outputs.acceptance-node == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: node
      toolchains: go node
      timeout: 45
      ref: ${{ inputs.ref || '' }}

  acceptance-python:
    needs: changes
    if: needs.changes.outputs.acceptance-python == 'true'
    uses: ./.github/workflows/gate-corpus.yml
    with:
      gate: acceptance
      corpus: python
      toolchains: go python
      timeout: 45
      ref: ${{ inputs.ref || '' }}

  # cloud/ (the Next.js dashboard): its own checks, only when it changed.
  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - id: node
        working-directory: .
        run: echo "version=$(sed -n '/^\[node\]/,/^\[/s/^version = "\(.*\)"/\1/p' versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The route types (PageProps, LayoutProps) are generated into .next/,
      # which `next dev` and `next build` write and a fresh checkout lacks.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  cloud-overview-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'cloud-overview-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npx vitest run components/savings-summary.test.ts lib/job-savings.test.ts lib/overview-ci.test.ts
        env:
          QUOD_OVERVIEW_PREVIEW: /tmp/quod-overview-preview
      - name: Render overview previews
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,800 --screenshot=/tmp/quod-overview-preview/desktop.png file:///tmp/quod-overview-preview/measuring.html
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=/tmp/quod-overview-preview/mobile.png file:///tmp/quod-overview-preview/known-free-runners.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloud-overview-preview
          path: /tmp/quod-overview-preview

  # Validate and render the public site without deploying or calling its form.
  landing:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'landing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CONVEX_URL: https://preview.convex.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Full-site lint currently flags existing effects in docs/theme-toggle,
      # docs/toc and the unused terminal. Keep this copy/layout gate scoped;
      # type checking and the production build below still cover the whole site.
      - name: Lint landing source
        run: >-
          npx eslint app/page.tsx app/under-the-hood/page.tsx app/layout.tsx app/actions.ts
          components/ci-job.tsx components/flow.tsx components/site-nav.tsx
          components/workflow-diff.tsx lib/benchmark.ts
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
      - run: npm install --prefix /tmp/quod-landing-browser --ignore-scripts --no-package-lock playwright-core@1.65.0
      - name: Render desktop and mobile pages
        run: |
          mkdir -p /tmp/quod-landing-preview
          npm start -- --port 3000 > /tmp/quod-landing-preview/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /tmp/quod-landing-preview/home.html; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/under-the-hood > /tmp/quod-landing-preview/under-the-hood.html
          NODE_PATH=/tmp/quod-landing-browser/node_modules node ../scripts/landing-preview.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: landing-preview
          path: /tmp/quod-landing-preview
          retention-days: 14
