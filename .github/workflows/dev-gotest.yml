# TEMPORARY (exp/gotest-shadow only; removed before review): one cycle of
# rustfmt (as a patch), clippy and the gotest_shadow unit tests, for an
# author who cannot run cargo locally. The real gates are gate.yml's.
name: dev-gotest

on:
  push:
    branches: ['exp/gotest-shadow']
    paths: ['crates/quod-cli/**', '.github/workflows/dev-gotest.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain (rust-toolchain.toml)
        run: |
          ch=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench-binary
          cache-on-failure: true
      - name: fmt
        run: |
          mkdir -p out
          cargo fmt --all
          git diff > out/fmt.patch
          wc -l out/fmt.patch
      - name: clippy
        continue-on-error: true
        run: cargo clippy -q -p quod-cli --all-targets -- -D warnings 2>&1 | tee out/clippy.txt; exit "${PIPESTATUS[0]}"
      - name: tests
        continue-on-error: true
        run: cargo test -q -p quod-cli --bin quod gotest_shadow 2>&1 | tee out/test.txt; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dev-gotest
          path: out/
