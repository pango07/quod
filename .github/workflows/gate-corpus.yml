# One corpus gate of gate.yml: the hooks suite or scripts/acceptance.sh on
# one pinned corpus repo. Called by gate.yml only.
name: gate-corpus

on:
  workflow_call:
    inputs:
      gate:
        description: hooks or acceptance (a scripts/ci-gate.sh command)
        type: string
        required: true
      corpus:
        description: go, node, python or hooks (scripts/ci-gate.sh corpus)
        type: string
        required: true
      toolchains:
        description: toolchains to install at /usr/local
        type: string
        required: true
      timeout:
        type: number
        required: true
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  QUOD_GATE_LOGS: ${{ github.workspace }}/target/gate-logs
  # Under /work, as in the dev container (ci-gate.sh setup makes it): the
  # sandbox cannot traverse /home/runner (0750), and neither checkout nor
  # rust-cache touches /work. QUOD_HOME holds step A's dependency trees.
  CORPUS: /work/corpus/${{ inputs.corpus }}
  QUOD_HOME: /work/state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/quod-host
        with:
          toolchains: ${{ inputs.toolchains }}
      # Dependencies' build output only (rust-cache drops the workspace's
      # own crates): every job rebuilds Quod itself from this checkout.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
      - id: pin
        run: |
          v() { sed -n "/^\[$1\]/,/^\[/s/^$2 = \"\(.*\)\"/\1/p" versions.toml; }
          case "${{ inputs.corpus }}" in
            go) key="go-$(v spike_repo commit)";;
            hooks) key="hooks-$(v spike_repo commit)-go$(v go version)";;
            *) key="${{ inputs.corpus }}-$(v "corpus.${{ inputs.corpus }}" commit)";;
          esac
          echo "key=corpus-$key-v1" >> "$GITHUB_OUTPUT"
      # The pristine clone at the pinned commit (for hooks, plus the module
      # cache its jobs are seeded from), saved right after it is made, never
      # after a gate ran on it. docs/ci.md: what is cached and why.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: ${{ steps.pin.outputs.key }}
      - run: scripts/ci-gate.sh corpus ${{ inputs.corpus }} "$CORPUS"
      - if: steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: ${{ steps.pin.outputs.key }}
      - id: gate
        run: |
          if [ "${{ inputs.gate }}" = hooks ]; then scripts/ci-gate.sh hooks "$CORPUS"
          else scripts/ci-gate.sh acceptance ${{ inputs.corpus }} "$CORPUS"; fi
      - if: always()
        run: |
          n=${{ inputs.gate }}; [ "$n" = hooks ] || n=acceptance-${{ inputs.corpus }}
          scripts/ci-gate.sh summary "$n" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.gate }}-${{ inputs.corpus }}-logs
          path: |
            target/gate-logs/
            target/acceptance-evidence/
          retention-days: 14
          if-no-files-found: ignore
