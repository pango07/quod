# A cli/cli job every step of which can be proven: the go-test job's
# checkout, setup-go (used directly: cli/cli's composite also runs
# actions/cache, which uses the network) and its two builds.
name: go-build
on:
  push:
    branches: [runner-lab]
    paths: [.github/workflows/go-build.yml]
  workflow_dispatch:
    inputs:
      commit:
        description: cli/cli commit
        default: 9490d204a2ba95434153dedce99898ce9f281426
jobs:
  build:
    runs-on: [self-hosted, stillpass]
    container:
      image: golang@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
      options: --user 1001:1001
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cli/cli
          ref: ${{ inputs.commit || '9490d204a2ba95434153dedce99898ce9f281426' }}
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build -v ./cmd/gh
      - name: Build with debug overrides
        run: go build -v -tags=ghdebug ./cmd/gh
